<!doctype html><html lang=en><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1">
<title>Sanket Story Radio</title><link rel=preconnect href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;800&family=Share+Tech+Mono&display=swap" rel=stylesheet><style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:'Share Tech Mono',ui-monospace,monospace;color:#eee;-webkit-user-select:none;user-select:none;
 background:radial-gradient(circle at 15% 10%,#ff3d7f 0,transparent 40%),radial-gradient(circle at 90% 20%,#ffb800 0,transparent 35%),radial-gradient(circle at 50% 100%,#00c2ff 0,transparent 45%),linear-gradient(135deg,#2b0a5e,#0b1e4a 60%,#062a2a);background-attachment:fixed;padding:14px}
.rig{max-width:520px;margin:0 auto;background:linear-gradient(180deg,#3a3f47,#1d2026);border-radius:22px;padding:16px;box-shadow:0 20px 50px #0009,inset 0 2px 0 #fff3,inset 0 -3px 0 #0006;border:2px solid #555b66;position:relative}
.rig:before,.rig:after{content:'';position:absolute;top:10px;width:10px;height:10px;border-radius:50%;background:radial-gradient(#999,#333)}.rig:before{left:10px}.rig:after{right:10px}
.brand{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.brand h1{font-family:Orbitron,sans-serif;font-size:clamp(15px,4.6vw,22px);margin:0;letter-spacing:2px;background:linear-gradient(90deg,#ffd23f,#ff7a18,#ff3d7f);-webkit-background-clip:text;background-clip:text;color:transparent}
.brand small{display:block;color:#9aa;font-size:11px;letter-spacing:3px}
.leds{display:flex;gap:10px;font-size:11px}.led{display:flex;flex-direction:column;align-items:center;gap:3px;color:#aaa}
.led i{width:14px;height:14px;border-radius:50%;background:#333;box-shadow:inset 0 1px 3px #000}
.led.tx.on i{background:#ff2d2d;box-shadow:0 0 12px #ff2d2d,0 0 4px #fff inset}.led.rx.on i{background:#39ff88;box-shadow:0 0 12px #39ff88,0 0 4px #fff inset}.led.pw i{background:#ffb800;box-shadow:0 0 10px #ffb800}
.lcd{background:linear-gradient(180deg,#0f2a1a,#08180f);border-radius:10px;padding:10px 14px;border:3px solid #111;box-shadow:inset 0 0 20px #000,0 0 18px #39ff8833;color:#39ff88;text-shadow:0 0 8px #39ff88}
.lcd .row{display:flex;justify-content:space-between;align-items:baseline;font-size:12px;opacity:.85}
.freq{font-family:Orbitron,sans-serif;font-weight:800;font-size:clamp(26px,9vw,44px);letter-spacing:3px;text-align:center;margin:4px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#st{text-align:center;font-size:15px;min-height:20px}
.meter{margin-top:8px}.meter .lab{display:flex;justify-content:space-between;font-size:10px;opacity:.8}
.bars{display:flex;gap:3px;height:16px;margin-top:2px}.bars b{flex:1;background:#123;border-radius:2px;transition:background .05s}
.bars b.l{background:#39ff88;box-shadow:0 0 6px #39ff88}.bars b.l.y{background:#ffd23f;box-shadow:0 0 6px #ffd23f}.bars b.l.r{background:#ff2d2d;box-shadow:0 0 6px #ff2d2d}
.panel{margin-top:14px;background:#0005;border-radius:12px;padding:10px;border:1px solid #fff1}
.panel h3{margin:0 0 8px;font-family:Orbitron,sans-serif;font-size:12px;letter-spacing:2px;color:#ffd23f;display:flex;justify-content:space-between;align-items:center}
#count{color:#39ff88;text-shadow:0 0 8px #39ff88}
#us{display:flex;flex-wrap:wrap;gap:6px;padding:0;margin:0}
#us li{list-style:none;font-family:Orbitron,sans-serif;font-size:12px;padding:5px 10px;border-radius:999px;background:linear-gradient(135deg,#00c2ff,#7a5cff);color:#fff;box-shadow:0 2px 6px #0007;text-transform:uppercase;letter-spacing:1px}
#us li.me{background:linear-gradient(135deg,#ffb800,#ff7a18)}#us li.tk{background:linear-gradient(135deg,#ff2d2d,#ff3d7f);box-shadow:0 0 14px #ff2d2d;animation:pulse 1s infinite}
#us li.none{background:#333}
@keyframes pulse{50%{transform:scale(1.06)}}
input{font:inherit;font-size:17px;width:100%;padding:12px;margin:5px 0;border-radius:10px;border:2px solid #444;background:#0b0f14;color:#39ff88}
button{font-family:Orbitron,sans-serif;cursor:pointer;border:0;border-radius:10px;color:#fff}
#go{width:100%;font-size:18px;padding:14px;margin-top:6px;background:linear-gradient(135deg,#39d98a,#00a86b);box-shadow:0 4px 0 #006b44,0 8px 20px #0008}
#go:active{transform:translateY(3px);box-shadow:0 1px 0 #006b44}
#ptt{width:min(62vw,230px);height:min(62vw,230px);border-radius:50%;margin:18px auto 6px;display:block;touch-action:none;-webkit-touch-callout:none;font-size:20px;letter-spacing:2px;
 background:radial-gradient(circle at 35% 30%,#7dffb5,#16c060 45%,#076b33);border:6px solid #222;box-shadow:0 0 0 4px #555,0 0 30px #39ff88aa,inset 0 -8px 16px #0006;text-shadow:0 1px 3px #0008;transition:transform .08s}
#ptt.on{background:radial-gradient(circle at 35% 30%,#ff9a9a,#ff2020 45%,#8a0000);box-shadow:0 0 0 4px #555,0 0 50px #ff2020,inset 0 -8px 16px #0006;transform:scale(.96)}
#ptt.busy{background:radial-gradient(circle at 35% 30%,#ffe39a,#ffae00 45%,#8a5a00);box-shadow:0 0 0 4px #555,0 0 40px #ffae00,inset 0 -8px 16px #0006}
#ptt.wait{filter:brightness(1.2)}
.hint{text-align:center;color:#889;font-size:11px}
#unlock{display:none;width:100%;padding:12px;margin-top:8px;background:linear-gradient(135deg,#ffb800,#ff7a18);color:#111}
#main{display:none}
#log{list-style:none;padding:0;margin:0;max-height:300px;overflow:auto}
#log li{display:flex;align-items:center;gap:8px;padding:6px;border-bottom:1px dashed #fff2;font-size:13px}
#log li .cs{font-family:Orbitron,sans-serif;color:#00c2ff;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#log li.mine .cs{color:#ffb800}#log li .tm{color:#aaa}#log li .du{color:#39ff88;min-width:44px;text-align:right}
#log button{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,#39d98a,#00a86b);font-size:15px}
#log button.playing{background:linear-gradient(135deg,#ff2d2d,#ff3d7f)}
#clr{font-size:10px;padding:6px 10px;background:#a33}
#net{margin-top:10px;font-size:10px;color:#9ab;text-align:center;word-break:break-all}
#map{height:230px;border-radius:12px;border:2px solid #00c2ff55;margin-top:8px;z-index:0}
#locnote{font-size:11px;color:#ffb800;background:#ffb80018;border:1px dashed #ffb80088;border-radius:8px;padding:6px;margin:4px 0}
#lt{font-size:11px;display:flex;gap:4px;align-items:center;color:#39ff88}#lt input{width:auto;margin:0}
.pin{font-size:10px;color:#9ef;margin-left:6px;opacity:.9}.lg{font-size:10px;color:#9ef;display:block}
.mk{width:16px;height:16px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 6px #000}.mk.tk{background:#ff2d2d!important;animation:pz 1s infinite}
@keyframes pz{0%{box-shadow:0 0 0 0 #ff2d2dcc}100%{box-shadow:0 0 0 14px #ff2d2d00}}
#sstvList{list-style:none;padding:0;margin:0}#sstvList li{padding:6px 0;border-top:1px solid #fff2}#sstvList canvas,#sstvList img{width:100%;max-width:320px;display:block;border-radius:6px;background:#000;image-rendering:auto}
#sstvList .sm{font-size:11px;opacity:.8;display:flex;justify-content:space-between;gap:6px;flex-wrap:wrap}#sstvP button{font-family:inherit;background:#2a2f38;color:#eee;border:1px solid #fff3;border-radius:8px;padding:8px;cursor:pointer}
</style>
<style>
#story{white-space:pre-wrap;font-family:system-ui,sans-serif;font-size:16px;line-height:1.5;max-height:42vh;overflow:auto;color:#eee;user-select:text;-webkit-user-select:text}
#ptt2{width:100%;margin-top:14px;padding:26px;font-family:Orbitron,sans-serif;font-size:22px;border-radius:16px;border:3px solid #111;background:radial-gradient(#ff5a5a,#a00);color:#fff;touch-action:none}
#ptt2.on{background:radial-gradient(#39ff88,#0a6);box-shadow:0 0 24px #39ff88}
.ctl{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.ctl select,.ctl input,.ctl button{padding:8px;border-radius:8px;border:1px solid #555;background:#111;color:#eee;font-family:inherit}
.ctl input{flex:1;min-width:140px}#note{font-size:11px;color:#ffd23f;min-height:14px;margin-top:4px}
</style></head><body><div class=rig>
<div class=brand><div><h1>SANKET STORY RADIO</h1><small>AI STORIES · ON AIR</small></div><div class=leds><div class="led pw"><i></i>PWR</div><div class="led rx" id=rxl><i></i>PLAY</div><div class="led tx" id=txl><i></i>REQ</div></div></div>
<div class=lcd><div class=row><span id=chl>CH story-1</span><span id=eng>ENGINE free</span></div><div class=freq id=title>STORY RADIO</div><div id=st>Tap START to begin</div></div>
<div class=panel><h3>NOW TELLING <span id=lang2></span></h3><div id=story>Press START. Stories play automatically. Hold the button and ask for a story, or type below.</div></div>
<button id=start style="width:100%;margin-top:10px;padding:12px;font-family:Orbitron">▶ START RADIO</button>
<button id=ptt2>HOLD · ASK FOR A STORY</button>
<div class=ctl><input id=req placeholder="e.g. a brave dog / बहादुर कुत्ता"><button id=send>ASK</button><button id=skip>⏭ SKIP</button></div>
<div id=note></div>
<div class=panel><h3>SETTINGS</h3><div class=ctl>
<select id=lang><option value=en>English</option><option value=hi>हिन्दी Hindi</option></select>
<select id=engine><option value=grok>Grok (xAI)</option><option value=openai>ChatGPT (OpenAI)</option><option value=free>Free (Pollinations, no key)</option></select>
<input id=ch placeholder="channel" value="story-1"><label style="font-size:12px"><input type=checkbox id=bc> share over channel</label></div>
<div class=ctl><input id=kx type=password placeholder="xAI API key (stored only in this browser)"><input id=ko type=password placeholder="OpenAI API key (stored only in this browser)"></div></div>
</div>
<script src="https://unpkg.com/mqtt@5/dist/mqtt.min.js"></script>
<script>
const $=id=>document.getElementById(id),LS=localStorage;
const PFX='sanket-story-radio-5c1e/';
['lang','engine','ch','kx','ko'].forEach(k=>{if(LS['ssr_'+k])$(k).value=LS['ssr_'+k];$(k).onchange=()=>{LS['ssr_'+k]=$(k).value;upd();if(k=='ch')sub()}});
$('bc').checked=LS.ssr_bc==='1';$('bc').onchange=()=>{LS.ssr_bc=$('bc').checked?'1':'0'};
if(!LS.ssr_engine)$('engine').value='free';
function upd(){$('eng').textContent='ENGINE '+$('engine').value;$('chl').textContent='CH '+$('ch').value;$('lang2').textContent=$('lang').value.toUpperCase()}upd();
const note=t=>{$('note').textContent=t||''};
const FALL={en:[["The Brave Little Dog","Bruno was a small brown dog who lived at the edge of a quiet village. One rainy evening he heard a tiny kitten crying from a drain. Bruno was scared of the rushing water, but he took a deep breath, barked loudly for help and stayed beside the kitten until the farmer came with a ladder. The kitten was saved, and from that day the two were best friends. Bruno learned that being brave does not mean you are never scared; it means you help even when you are. The end."],["The Moon's Lost Smile","One night the Moon forgot how to smile. The stars tried jokes, the owls sang songs, but nothing worked. Then a little girl named Asha looked up from her window and waved. She drew a big smiling moon on paper and held it up to the sky. The Moon saw it and laughed so brightly that the whole village glowed silver. Asha learned that a small kind act can light up the world. The end."],["Tiko the Turtle","Tiko the turtle wanted to see the mountain top. Everyone said he was too slow. Tiko walked a little every day, resting under trees and making friends with ants, birds and a sleepy bear. After many days he reached the top and saw the sunrise over the whole forest. His friends cheered for him. Slow and steady, Tiko showed that patience can take you anywhere. The end."]],
hi:[["बहादुर कुत्ता","गाँव के किनारे ब्रूनो नाम का एक छोटा भूरा कुत्ता रहता था। एक बारिश वाली शाम उसने नाले में एक छोटे बिल्ली के बच्चे को रोते सुना। ब्रूनो पानी से डरता था, पर उसने गहरी साँस ली, ज़ोर से भौंककर मदद बुलाई और किसान के आने तक बिल्ली के पास रहा। बिल्ली बच गई और दोनों पक्के दोस्त बन गए। ब्रूनो ने सीखा कि बहादुरी का मतलब डर न होना नहीं, बल्कि डर के बावजूद मदद करना है। समाप्त।"],["चाँद की मुस्कान","एक रात चाँद मुस्कुराना भूल गया। तारों ने चुटकुले सुनाए, उल्लुओं ने गाने गाए, पर कुछ नहीं हुआ। तभी आशा नाम की एक छोटी लड़की ने खिड़की से हाथ हिलाया और कागज़ पर मुस्कुराता चाँद बनाकर आसमान को दिखाया। चाँद इतनी ज़ोर से हँसा कि पूरा गाँव चाँदी-सा चमक उठा। आशा ने सीखा कि छोटी-सी भलाई दुनिया रोशन कर सकती है। समाप्त।"],["धीमा कछुआ टीको","टीको कछुआ पहाड़ की चोटी देखना चाहता था। सबने कहा तुम बहुत धीमे हो। टीको रोज़ थोड़ा-थोड़ा चलता, पेड़ों के नीचे आराम करता और चींटियों, चिड़ियों और एक नींद वाले भालू से दोस्ती करता। कई दिनों बाद वह चोटी पर पहुँचा और पूरे जंगल पर सूरज उगते देखा। धीरे-धीरे पर लगातार चलकर टीको ने दिखाया कि धैर्य कहीं भी ले जा सकता है। समाप्त।"]]};
const TOP={en:['a curious robot','a kind elephant','a magic kite','a lost star','a clever monkey','a friendly dragon','a rainbow fish','a little train'],hi:['एक जिज्ञासु रोबोट','एक दयालु हाथी','एक जादुई पतंग','एक खोया तारा','एक चतुर बंदर','एक दोस्ताना ड्रैगन','एक रंगीन मछली','एक छोटी रेलगाड़ी']};
function prompt(topic,lang){return 'You are a gentle storyteller for young children (age 4-10). Write ONE original, completely kid-safe story (no violence, fear, romance, brands or unsafe content) about: "'+topic.slice(0,200)+'". Length 150-230 words (about 1-2 minutes read aloud). Language: '+(lang=='hi'?'simple Hindi in Devanagari script':'simple English')+'. First line: a short title only. Then the story. End with a gentle happy ending. No markdown, no asterisks.'}
async function chat(url,key,model,p){const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+key},body:JSON.stringify({model,messages:[{role:'user',content:p}],temperature:0.9})});if(!r.ok)throw Error(r.status);const j=await r.json();return j.choices[0].message.content}
async function free(p){const ctl=new AbortController();setTimeout(()=>ctl.abort(),45000);const r=await fetch('https://text.pollinations.ai/'+encodeURIComponent(p)+'?seed='+Math.floor(Math.random()*1e6),{signal:ctl.signal});if(!r.ok)throw Error(r.status);const t=await r.text();if(t.length<80||/^\s*[{<]/.test(t))throw Error('bad');return t}
async function gen(topic,lang){const p=prompt(topic,lang),e=$('engine').value;let t;
 try{if(e=='grok'){if(!$('kx').value)throw Error('no xAI key');t=await chat('https://api.x.ai/v1/chat/completions',$('kx').value.trim(),'grok-3-mini',p)}
  else if(e=='openai'){if(!$('ko').value)throw Error('no OpenAI key');t=await chat('https://api.openai.com/v1/chat/completions',$('ko').value.trim(),'gpt-4o-mini',p)}}
 catch(x){note('⚠ '+e+' failed ('+x.message+') — using free engine')}
 if(!t){try{t=await free(p)}catch(x){for(let i=0;i<2&&!t;i++){.textContent='⏳ free engine busy, retrying…';await new Promise(r=>setTimeout(r,16000));try{t=await free(p)}catch(y){}}}}
 if(!t){{note($('note').textContent+' ⚠ free engine failed — playing a built-in story');const f=FALL[lang][Math.floor(Math.random()*3)];return {title:f[0],text:f[1]}}}
 t=t.replace(/[*#_]/g,'').trim();const ls=t.split('\n').filter(s=>s.trim());return {title:ls[0].replace(/^title:\s*/i,'').slice(0,60),text:ls.slice(1).join('\n\n')||ls[0]}}
let running=false,queue=[],speaking=false,busy=false;
function voiceFor(l){const v=speechSynthesis.getVoices();return v.find(x=>x.lang.startsWith(l=='hi'?'hi':'en-IN'))||v.find(x=>x.lang.startsWith(l))}
function speak(s){return new Promise(res=>{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(s.title+'. '+s.text);u.lang=s.lang=='hi'?'hi-IN':'en-IN';const v=voiceFor(s.lang);if(v)u.voice=v;u.rate=.95;let done=false;const fin=()=>{if(!done){done=true;res()}};u.onend=fin;u.onerror=fin;
 setTimeout(fin,Math.max(20000,s.text.length*90));speechSynthesis.speak(u)})}
async function loop(){while(running){let s=queue.shift();if(!s){busy=true;$('st').textContent='✍ writing a story…';const l=$('lang').value;s=await gen(TOP[l][Math.floor(Math.random()*8)],l);s.lang=l;busy=false;if(queue.length){queue.push(s);continue}}
 show(s);if($('bc').checked&&!s.remote)pub(s);$('rxl').classList.add('on');speaking=true;await speak(s);speaking=false;$('rxl').classList.remove('on');await new Promise(r=>setTimeout(r,1500))}}
function show(s){$('title').textContent=s.title.toUpperCase();$('story').textContent=s.title+'\n\n'+s.text;$('st').textContent=(s.req?'🎙 by request: '+s.req:'📻 on air')+(s.remote?' (from channel)':'')}
async function request(q){q=(q||'').trim();if(!q)return;const l=$('lang').value;$('st').textContent='✍ writing your story: '+q;note('');while(busy)await new Promise(r=>setTimeout(r,500));busy=true;const s=await gen(q,l);busy=false;s.lang=l;s.req=q;queue.unshift(s);
 if(!running){running=true;loop()}else{speechSynthesis.cancel()} return s}
window.request=request;
$('start').onclick=()=>{if(running){running=false;speechSynthesis.cancel();$('start').textContent='▶ START RADIO';$('st').textContent='stopped';return}running=true;$('start').textContent='■ STOP RADIO';loop()};
$('send').onclick=()=>{request($('req').value);$('req').value=''};$('req').onkeydown=e=>{if(e.key=='Enter')$('send').click()};
$('skip').onclick=()=>speechSynthesis.cancel();
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;let rec,heard='';
function down(e){e.preventDefault();if(!SR){note('Speech recognition not supported here — type your request below');$('req').focus();return}
 speechSynthesis.pause();heard='';rec=new SR();rec.lang=$('lang').value=='hi'?'hi-IN':'en-IN';rec.interimResults=true;rec.onresult=ev=>{heard=[...ev.results].map(r=>r[0].transcript).join(' ');$('st').textContent='🎙 '+heard};
 rec.onerror=ev=>note('mic: '+ev.error+' — type your request below');rec.onend=()=>{speechSynthesis.resume();if(heard)request(heard)};try{rec.start()}catch(x){}$('ptt2').classList.add('on');$('txl').classList.add('on');$('st').textContent='🎙 listening…'}
function up(){$('ptt2').classList.remove('on');$('txl').classList.remove('on');if(rec)try{rec.stop()}catch(x){}}
$('ptt2').addEventListener('pointerdown',down);['pointerup','pointerleave','pointercancel'].forEach(t=>$('ptt2').addEventListener(t,up));
let cli,cur;const me=Math.random().toString(36).slice(2,8);
function sub(){if(!cli)return;if(cur)cli.unsubscribe(cur);cur=PFX+$('ch').value+'/story';cli.subscribe(cur)}
function pub(s){if(cli&&cli.connected)cli.publish(PFX+$('ch').value+'/story',JSON.stringify({from:me,title:s.title,text:s.text,lang:s.lang,req:s.req}))}
try{cli=mqtt.connect('wss://public.cloud.shiftr.io',{username:'public',password:'public',clientId:'ssr-'+me});cli.on('connect',sub);
 cli.on('message',(t,m)=>{try{const j=JSON.parse(m);if(j.from==me||!j.text)return;j.remote=true;j.title=String(j.title).slice(0,80);j.text=String(j.text).slice(0,4000);queue.push(j);if(!speaking&&running)speechSynthesis.cancel()}catch(x){}})}catch(x){}
</script></body></html>
